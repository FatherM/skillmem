name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      MEM_SEMANTIC: "0"
      PYTHONUTF8: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Deliberately WITHOUT the [semantic] extra: no 220 MB model download in
      # the matrix. test_semantic.py skips itself when the embedder is absent.
      - name: Install (no semantic extra)
        run: python -m pip install -e ".[test]"
      - name: Run tests
        env:
          HOME: ${{ runner.temp }}/skillmem-home
          USERPROFILE: ${{ runner.temp }}/skillmem-home
          SKILLMEM_HOME: ${{ runner.temp }}/skillmem-home/memory
          SKILLMEM_DB: ${{ runner.temp }}/skillmem-home/memory/memory.db
        run: python -m pytest -q tests

  build:
    name: build (packaging smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install build
      - name: Build sdist + wheel
        run: python -m build

  test-semantic:
    name: test-semantic (ubuntu, py3.12)
    env:
      MEM_SEMANTIC: "1"
      SKILLMEM_MODEL_CACHE: /home/runner/.cache/skillmem-models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/skillmem-models
          # Bump the suffix when MODEL_NAME in skillmem/embed.py changes.
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2-v1
      - name: Install (with semantic extra)
        run: python -m pip install -e ".[test,semantic]"
      - name: Load model (fail instead of silently skipping semantic tests)
        run: python -c "from skillmem import embed; embed.allow_download(); assert embed.available(), 'semantic model unavailable'"
      - name: Run tests (semantic recall enabled)
        env:
          HOME: ${{ runner.temp }}/skillmem-home
          USERPROFILE: ${{ runner.temp }}/skillmem-home
          SKILLMEM_HOME: ${{ runner.temp }}/skillmem-home/memory
          SKILLMEM_DB: ${{ runner.temp }}/skillmem-home/memory/memory.db
        run: python -m pytest -q tests

  docker:
    name: docker (MCP stdio smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build image
        run: docker build -t skillmem:ci .
      - name: Check MCP with stdin held open
        run: bash scripts/docker_smoke.sh
